<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>touring-gacha</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main id="app">
    <section id="view-condition">
      <header class="app-header">
        <h1>ツーリング目的地ガチャ</h1>
        <p class="subtitle">今日はどこまで走る？</p>
        <button type="button" id="copy-settings-open-button" class="link-button">
          ⚙ コピーする情報を選ぶ
        </button>
      </header>

      <div class="card">
        <div class="location-icon" aria-hidden="true"></div>
        <div class="location-info">
          <p class="label">現在地</p>
          <p class="status" id="location-status">取得中…</p>
          <p class="coords" id="location-coords"></p>
        </div>
      </div>

      <div class="field">
        <p class="field-label">探索範囲</p>
        <div class="chip-group" id="radius-chips">
          <button type="button" class="chip" data-radius="10">10km</button>
          <button type="button" class="chip" data-radius="30">30km</button>
          <button type="button" class="chip active" data-radius="50">50km</button>
          <button type="button" class="chip" data-radius="100">100km</button>
        </div>
        <input type="range" id="radius-slider" min="0" max="3" step="1" value="2" />
      </div>

      <div class="field">
        <p class="field-label">目的地の種類</p>
        <div class="chip-group three-col" id="destination-type-chips">
          <button type="button" class="chip-card active" data-destination-type="shop">
            <span class="chip-card-title">スポット（店）</span>
            <span class="chip-card-note">飲食・休憩／買い物 等</span>
          </button>
          <button type="button" class="chip-card" data-destination-type="other">
            <span class="chip-card-title">スポット（店以外）</span>
            <span class="chip-card-note">峠・展望 等</span>
          </button>
          <button type="button" class="chip-card" data-destination-type="intersection">
            <span class="chip-card-title">交差点</span>
          </button>
        </div>
      </div>

      <div class="field" id="shop-category-field">
        <p class="field-label">店の種類</p>
        <div class="chip-group two-col" id="category-chips">
          <button type="button" class="chip-card active" data-category="food_rest">
            食事・休憩
          </button>
          <button type="button" class="chip-card" data-category="shopping_other">
            買い物・その他
          </button>
        </div>
      </div>

      <div class="field" id="parking-field" hidden>
        <p class="field-label">停車できる場所</p>
        <div class="chip-group two-col" id="parking-chips">
          <button type="button" class="chip-card" data-parking="required">必要</button>
          <button type="button" class="chip-card active" data-parking="any">問わない</button>
        </div>
        <p class="field-note">地図データから判断できる場合のみ条件に使用します</p>
      </div>

      <button type="button" id="search-button" class="primary-button" disabled>
        → 目的地をさがす
      </button>
      <p class="error-text" id="condition-error" hidden></p>
    </section>

    <section id="view-result" hidden>
      <header class="result-topbar">
        <button type="button" id="back-button" aria-label="戻る">←</button>
        <span id="radius-label"></span>
        <button type="button" id="recenter-button" aria-label="現在地に戻す">◎</button>
      </header>
      <div id="map"></div>
      <div id="result-status" class="result-status" hidden>
        <p id="result-status-text"></p>
        <button type="button" id="retry-button" class="primary-button" hidden>↻ もう一度探す</button>
      </div>
      <div id="result-sheet" class="sheet" hidden>
        <div id="sheet-collapsed">
          <button type="button" id="candidate-info-button" class="nearby-item nearby-item-destination">
            <span class="nearby-item-icon">📍</span>
            <span class="nearby-item-text">
              <p class="nearby-item-name" id="candidate-name"></p>
              <p class="nearby-item-subtitle" id="candidate-coords"></p>
              <p class="nearby-item-subtitle" id="candidate-distance"></p>
            </span>
            <span class="nearby-item-chevron">›</span>
          </button>
          <button type="button" id="reroll-button" class="primary-button">
            ↻ 再抽選
          </button>
          <button type="button" id="nearby-expand-toggle" class="sheet-expand-toggle sheet-expand-toggle-large">
            ⌃ 周辺のスポットを見る
          </button>
        </div>
        <div id="sheet-expanded" hidden>
          <button type="button" id="nearby-collapse-button" class="sheet-collapse-button">
            ⌄ 地図に戻る
          </button>
          <h2 class="nearby-heading">周辺情報</h2>
          <div class="nearby-list" id="nearby-destination-item"></div>
          <p class="nearby-subheading" id="nearby-count-label"></p>
          <p class="nearby-status" id="nearby-status" hidden></p>
          <div class="nearby-list" id="nearby-poi-list"></div>
        </div>
      </div>
    </section>

    <div id="copy-modal" class="modal" hidden>
      <div class="modal-content">
        <div class="modal-header">
          <h2>コピーする情報を選ぶ</h2>
          <button type="button" id="copy-close-button" aria-label="閉じる">×</button>
        </div>
        <p class="modal-description">
          ナビアプリにコピーする際、含める情報を選べます（このアプリ全体の設定として保存されます）。
        </p>
        <label class="checkbox-row">
          <input type="checkbox" id="copy-pref-latlon" />
          <span>緯度・経度</span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="copy-pref-name" />
          <span>名称</span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="copy-pref-address" />
          <span>住所（取得できる場合のみ使われます）</span>
        </label>
      </div>
    </div>

    <p id="toast" class="toast" hidden></p>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
